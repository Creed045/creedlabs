name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          VITE_SUPABASE_URL: https://bfmappzsrehaprdrgokw.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmbWFwcHpzcmVoYXByZHJnb2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MjE4NjMsImV4cCI6MjExMDM5Nzg2M30.1WVC8UhMJnR9Gkl3XVfD_OA4FvDiZc7wXIxmcRcswmI
          VITE_SQUAD_PUBLIC_KEY: pk_0774891bbcc91dc101d82a8b494a7146ed1c3db2
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4